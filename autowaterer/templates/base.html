<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Web App{% endblock %}</title>
    
    <!-- Link your global CSS stylesheet here -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    <!-- Dynamic placeholder for page-specific styles or scripts -->
    {% block head %}{% endblock %}
</head>
<body>

    <!-- Global Navigation Bar (Repeated on all pages) -->
    <nav>
        <a href="/">Home</a> | 
        <a href="/about">About</a>
    </nav>

    <!-- Main Content Area (Filled dynamically by child templates) -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Global Footer (Repeated on all pages) -->
    <footer>
        <p>&copy; 2026 My Web App</p>
    </footer>

    {% block scripts %}{% endblock %}

</body>
</html>
