{% extends 'base.html' %}

{% block title %}
Home Page
{% endblock %}

{% block head %}
<!-- Add an index-specific script if needed -->
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}

{% block content %}
<h1>Welcome to the Homepage</h1>
<p>This paragraph is injected seamlessly into the main block of the base template!</p>
<button id="water-button" onclick="startWatering()">Start Watering</button>
<p id="water-status"></p>
{% endblock %}

{% block scripts %}
<script>
async function startWatering() {
    const button = document.getElementById('water-button');
    const status = document.getElementById('water-status');

    button.disabled = true;
    status.textContent = 'Starting...';

    try {
        const response = await fetch('{{ url_for("autowater.water") }}', { method: 'POST' });
        status.textContent = await response.text();
    } catch (error) {
        status.textContent = `Could not reach the server: ${error.message}`;
    } finally {
        button.disabled = false;
    }
}
</script>
{% endblock %}
