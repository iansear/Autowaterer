{% extends 'base.html' %}

{% block title %}
Home - Autowaterer
{% endblock %}

{% block content %}
<h1>Autowaterer</h1>
<p>Autowaterer is a simple web application that allows you to start watering your plants.</p>
<p>Hello Dad!</p>
<button id="water-button" data-water-url="{{ url_for('autowater.water') }}">Start Watering</button>
<p id="water-status"></p>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/water.js') }}"></script>
{% endblock %}
