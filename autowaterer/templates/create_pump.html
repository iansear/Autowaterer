{% extends 'base.html' %}

{% block title %}
Create Pump - Autowaterer
{% endblock %}

{% block content %}
<h1>Create Pump</h1>
<form action="{{ url_for('autowater.create_pump') }}" method="post">
    <label for="name">Name</label>
    <input type="text" name="name" id="name" required>

    <label for="description">Description</label>
    <input type="text" name="description" id="description" required>

    <label for="gpio_pin">GPIO pin</label>
    <input type="number" name="gpio_pin" id="gpio_pin" required>

    <label for="rate">Rate (ml/s)</label>
    <input type="number" name="rate" id="rate" step="0.01" value="1.3" required>

    <button type="submit">Create Pump</button>
</form>
<p><a class="button" href="{{ url_for('autowater.pumps') }}">Back to pumps</a></p>
{% endblock %}
